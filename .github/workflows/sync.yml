name: Sync event data

on:
  schedule:
    # Every 6 hours at minute 17, away from the busy top of the hour.
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data-manual/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits with code 1 only when every automatic source failed, so GitHub emails the owner.
      - run: npm run sync

      - name: Commit changed data
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): sync $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main
